<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수식 카톡 입력기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Gothic+Coding&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<style>
  :root{
    --paper:#EEF3F5;
    --card:#FFFFFF;
    --ink:#1F2A44;
    --ink-soft:#5A6B85;
    --kakao:#FEE500;
    --coral:#FF6B57;
    --line:#DCE4EA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
    color:var(--ink);
    font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif;
    min-height:100vh;
    padding:20px 14px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  header{margin-bottom:18px;}
  h1{
    font-family:'Gaegu',sans-serif;
    font-weight:700;
    font-size:32px;
    margin:0;
    line-height:1.2;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px;
    margin-bottom:14px;
    box-shadow: 0 2px 0 var(--line);
  }
  .section{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:12px 0;
    border-bottom:1px dashed var(--line);
  }
  .section:first-child{padding-top:0;}
  .section:last-child{border-bottom:none;padding-bottom:0;}
  .section-label{
    display:flex;
    align-items:flex-start;
    gap:7px;
    flex:0 0 70px;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink);
    line-height:1.3;
    padding-top:3px;
  }
  .section-label::before{
    content:'';
    width:4px;height:14px;
    background:var(--coral);
    border-radius:2px;
    display:inline-block;
    flex-shrink:0;
    margin-top:1px;
  }
  .section.section-stack{
    display:block;
  }
  .section-stack .section-label{
    margin-bottom:9px;
    padding-top:0;
  }
  .section-label.toggle{
    cursor:pointer;
    justify-content:flex-start;
    align-items:center;
    gap:8px;
    user-select:none;
    width:100%;
    flex-wrap:wrap;
  }
  .section-label.toggle::before{display:none;}
  .section-label.toggle .label-left{
    display:flex;
    align-items:center;
    gap:7px;
    flex:1;
  }
  .label-left::before{
    content:'';
    width:4px;height:14px;
    background:var(--coral);
    border-radius:2px;
    display:inline-block;
  }
  .inline-convert-btn{
    flex-shrink:0;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    font-size:11px;
    font-weight:600;
    padding:5px 9px;
    border-radius:8px;
    cursor:pointer;
  }
  .inline-convert-btn:active{background:var(--coral);color:#fff;border-color:var(--coral);}
  .count-badge{
    font-size:11px;
    font-weight:500;
    color:var(--ink-soft);
    background:var(--paper);
    border:1px solid var(--line);
    padding:1px 7px;
    border-radius:10px;
  }
  .chevron{
    color:var(--ink-soft);
    font-size:12px;
    transition:transform .15s;
    flex-shrink:0;
  }
  .section-label.toggle.collapsed .chevron{transform:rotate(-90deg);}
  .sym-grid.collapsed{display:none;}
  .sym-grid{
    flex:1;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));
    gap:7px;
  }
  .sym-btn{
    aspect-ratio:1;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:9px;
    font-size:17px;
    color:var(--ink);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .1s, background .1s;
  }
  .sym-btn.small{font-size:15px;}
  .sym-btn:active{transform:scale(0.88);background:var(--coral);color:#fff;}
  .toolbar{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:10px;
  }
  .toolbar.collapsed{display:none;}
  .dock-top-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .more-toggle{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    flex:1;
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:12px;
    font-weight:600;
    padding:2px 0 10px;
    cursor:pointer;
  }
  .more-toggle .chevron{
    font-size:11px;
    transition:transform .15s;
  }
  .more-toggle.open .chevron{transform:rotate(180deg);}
  .mic-btn{
    flex-shrink:0;
    width:32px;
    height:32px;
    margin-bottom:8px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--paper);
    font-size:15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .mic-btn.listening{
    background:var(--coral);
    border-color:var(--coral);
    animation:mic-pulse 1s ease-in-out infinite;
  }
  .mic-btn.unsupported{display:none;}
  @keyframes mic-pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,107,87,0.5);}
    50%{box-shadow:0 0 0 6px rgba(255,107,87,0);}
  }
  .guide-btn{
    flex-shrink:0;
    width:32px;
    height:32px;
    margin-bottom:8px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .guide-btn.unsupported{display:none;}
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(31,42,68,0.45);
    z-index:200;
    align-items:flex-end;
    justify-content:center;
  }
  .modal-overlay.open{display:flex;}
  .modal-panel{
    background:var(--card);
    width:100%;
    max-width:640px;
    max-height:80vh;
    border-radius:18px 18px 0 0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .modal-header h2{
    margin:0;
    font-family:'Gaegu',sans-serif;
    font-size:20px;
  }
  .modal-close{
    border:none;
    background:var(--paper);
    color:var(--ink-soft);
    width:28px;
    height:28px;
    border-radius:50%;
    cursor:pointer;
    font-size:13px;
  }
  .modal-body{
    padding:8px 16px 20px;
    overflow-y:auto;
  }
  .guide-section-label{
    font-size:12.5px;
    font-weight:700;
    color:var(--ink);
    margin:14px 0 6px;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .guide-section-label::before{
    content:'';
    width:4px;height:14px;
    background:var(--coral);
    border-radius:2px;
    display:inline-block;
  }
  .guide-row{
    display:grid;
    grid-template-columns:88px 1fr;
    align-items:start;
    gap:10px;
    padding:7px 0;
    border-bottom:1px dashed var(--line);
  }
  .guide-symbol{
    font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif;
    font-size:14px;
    font-weight:700;
    color:var(--ink);
    line-height:1.4;
    min-width:0;
    overflow-wrap:break-word;
  }
  .guide-trigger{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .tool-btn{
    border:1px solid var(--ink);
    background:var(--card);
    color:var(--ink);
    font-weight:700;
    font-size:13px;
    padding:9px 10px;
    border-radius:10px;
    cursor:pointer;
  }
  .tool-btn:active{background:var(--ink);color:var(--kakao);}
  .tool-btn.clear{border-color:var(--line);color:var(--ink-soft);font-weight:500;}
  textarea{
    width:100%;
    min-height:90px;
    resize:vertical;
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px;
    font-family:'Nanum Gothic Coding',monospace;
    font-size:16px;
    color:var(--ink);
    background:#FBFCFD;
    line-height:1.6;
  }
  textarea:focus{outline:2px solid var(--coral);outline-offset:1px;}
  .action-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:10px;
  }
  .action-row .tool-btn.clear{margin:0;}
  .copy-btn{
    width:100%;
    background:var(--kakao);
    border:none;
    color:var(--ink);
    font-weight:700;
    font-size:15px;
    padding:9px 10px;
    border-radius:10px;
    cursor:pointer;
    transition:background .15s;
  }
  .copy-btn.copied{background:var(--ink);color:var(--kakao);}
  .input-dock{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    max-width:640px;
    margin:0 auto;
    border-radius:18px 18px 0 0;
    box-shadow:0 -4px 16px rgba(31,42,68,0.12);
    z-index:100;
  }
  #dockSpacer{height:0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>수식 카톡 입력기</h1>
  </header>

  <div class="card" id="grids"></div>

  <div class="card input-dock">
    <div class="dock-top-row">
      <button class="more-toggle" id="moreToggle"><span>더 보기 (줄긋기 · 순환마디 점)</span><span class="chevron">▾</span></button>
      <button class="mic-btn unsupported" id="micBtn" title="음성으로 입력">🎤</button>
      <button class="guide-btn unsupported" id="guideBtn" title="음성 가이드">❓</button>
    </div>
    <div class="toolbar collapsed" id="moreToolbar">
      <button class="tool-btn" id="barBtn">선택 영역 줄긋기 (x̄)</button>
      <button class="tool-btn" id="dotBtn">선택 영역 순환마디 점 (1˙2˙)</button>
    </div>
    <textarea id="eqInput" placeholder="여기에 입력하세요."></textarea>
    <div class="action-row">
      <button class="tool-btn clear" id="clearBtn">전체 지우기</button>
      <button class="copy-btn" id="copyBtn">복사하기</button>
    </div>
  </div>
  <div id="dockSpacer"></div>

</div>

<div class="modal-overlay" id="guideOverlay">
  <div class="modal-panel">
    <div class="modal-header">
      <h2>음성 입력 가이드</h2>
      <button class="modal-close" id="closeGuide">✕</button>
    </div>
    <div class="modal-body" id="guideBody"></div>
  </div>
</div>

<script>
const supMap = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','=':'⁼','(':'⁽',')':'⁾',
  'a':'ᵃ','b':'ᵇ','c':'ᶜ','d':'ᵈ','e':'ᵉ','f':'ᶠ','g':'ᵍ','h':'ʰ','i':'ⁱ','j':'ʲ','k':'ᵏ','l':'ˡ','m':'ᵐ','n':'ⁿ','o':'ᵒ','p':'ᵖ','r':'ʳ','s':'ˢ','t':'ᵗ','u':'ᵘ','v':'ᵛ','w':'ʷ','x':'ˣ','y':'ʸ','z':'ᶻ'};
const subMap = {'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','+':'₊','-':'₋','=':'₌','(':'₍',')':'₎',
  'a':'ₐ','e':'ₑ','h':'ₕ','i':'ᵢ','j':'ⱼ','k':'ₖ','l':'ₗ','m':'ₘ','n':'ₙ','o':'ₒ','p':'ₚ','r':'ᵣ','s':'ₛ','t':'ₜ','u':'ᵤ','v':'ᵥ','x':'ₓ'};

const categories = [
  { name:'기본·연산·비교', symbols:['+','-','×','÷','=','≠','<','>','≤','≥','≈','±','√','∛','∜','∞','·',':','%','|'] },
  { name:'그리스문자', symbols:['α','β','γ','δ','ε','θ','λ','μ','π','ρ','σ','φ','χ','ω','Σ','Δ','Ω','Φ'] },
  { name:'집합·논리', symbols:['∈','∉','⊂','⊃','∪','∩','∀','∃','∅','¬'] },
  { name:'화살표', symbols:['→','←','↔','⇒','⇔','↑','↓'] },
  { name:'미적분', symbols:['∫','∬','∂','∇','lim','Σ','Δ'] },
  { name:'도형·각도', symbols:['∠','△','□','⊥','∥','°','≡','≅','∽'] },
  { name:'기타', symbols:['(',')','[',']','{','}','∴','∵','≒','′','″'] },
  { name:'위첨자 (지수)', symbols: Object.values(supMap), small:true, collapsible:true, convertLabel:'선택 영역 위첨자로', convertMap:supMap },
  { name:'아래첨자', symbols: Object.values(subMap), small:true, collapsible:true, convertLabel:'선택 영역 아래첨자로', convertMap:subMap },
];

const gridsEl = document.getElementById('grids');
const input = document.getElementById('eqInput');

const RECENT_KEY = 'mathInput_recentSymbols';
const RECENT_MAX = 10;
let recentSymbols = [];
try{
  recentSymbols = JSON.parse(localStorage.getItem(RECENT_KEY)) || [];
}catch(e){
  recentSymbols = [];
}

const recentSection = document.createElement('div');
recentSection.className = 'section';
recentSection.id = 'recentSection';
recentSection.style.display = 'none';
const recentLabel = document.createElement('div');
recentLabel.className = 'section-label';
recentLabel.textContent = '최근 사용';
const recentGrid = document.createElement('div');
recentGrid.className = 'sym-grid';
recentSection.appendChild(recentLabel);
recentSection.appendChild(recentGrid);
gridsEl.appendChild(recentSection);

function renderRecent(){
  recentGrid.innerHTML = '';
  if(recentSymbols.length === 0){
    recentSection.style.display = 'none';
    return;
  }
  recentSection.style.display = '';
  recentSymbols.forEach(sym => {
    const btn = document.createElement('button');
    btn.className = 'sym-btn';
    btn.textContent = sym;
    btn.addEventListener('click', () => { insertAtCursor(sym); trackRecent(sym); });
    recentGrid.appendChild(btn);
  });
}

function trackRecent(sym){
  recentSymbols = recentSymbols.filter(s => s !== sym);
  recentSymbols.unshift(sym);
  if(recentSymbols.length > RECENT_MAX) recentSymbols = recentSymbols.slice(0, RECENT_MAX);
  try{ localStorage.setItem(RECENT_KEY, JSON.stringify(recentSymbols)); }catch(e){}
  renderRecent();
  updateDockSpacer();
}

renderRecent();

categories.forEach(cat => {
  const section = document.createElement('div');
  section.className = cat.collapsible ? 'section section-stack' : 'section';

  const grid = document.createElement('div');
  grid.className = 'sym-grid';
  cat.symbols.forEach(sym => {
    const btn = document.createElement('button');
    btn.className = 'sym-btn' + (cat.small ? ' small' : '');
    btn.textContent = sym;
    btn.addEventListener('click', () => { insertAtCursor(sym); trackRecent(sym); });
    grid.appendChild(btn);
  });

  const label = document.createElement('div');

  if(cat.collapsible){
    grid.classList.add('collapsed');
    label.className = 'section-label toggle collapsed';

    const labelLeft = document.createElement('span');
    labelLeft.className = 'label-left';
    labelLeft.innerHTML = `${cat.name} <span class="count-badge">${cat.symbols.length}개</span>`;
    label.appendChild(labelLeft);

    if(cat.convertMap){
      const convertBtn = document.createElement('button');
      convertBtn.className = 'inline-convert-btn';
      convertBtn.textContent = cat.convertLabel;
      convertBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        convertSelection(cat.convertMap);
      });
      label.appendChild(convertBtn);
    }

    const chevron = document.createElement('span');
    chevron.className = 'chevron';
    chevron.textContent = '▾';
    label.appendChild(chevron);

    label.addEventListener('click', () => {
      const isCollapsed = grid.classList.toggle('collapsed');
      label.classList.toggle('collapsed', isCollapsed);
    });
  }else{
    label.className = 'section-label';
    label.textContent = cat.name;
  }

  section.appendChild(label);
  section.appendChild(grid);
  gridsEl.appendChild(section);
});

function insertAtCursor(text){
  const start = input.selectionStart ?? input.value.length;
  const end = input.selectionEnd ?? input.value.length;
  input.value = input.value.slice(0,start) + text + input.value.slice(end);
  const newPos = start + text.length;
  input.setSelectionRange(newPos, newPos);
}

function convertSelection(map){
  const start = input.selectionStart;
  const end = input.selectionEnd;
  if(start === end){
    return;
  }
  const selected = input.value.slice(start,end);
  const converted = [...selected].map(ch => map[ch.toLowerCase()] ?? map[ch] ?? ch).join('');
  input.value = input.value.slice(0,start) + converted + input.value.slice(end);
  const newPos = start + converted.length;
  input.setSelectionRange(start, newPos);
}

function addCombiningMark(mark){
  const start = input.selectionStart;
  const end = input.selectionEnd;
  if(start === end){
    return;
  }
  const selected = input.value.slice(start,end);
  const converted = [...selected].map(ch => /\s/.test(ch) ? ch : ch + mark).join('');
  input.value = input.value.slice(0,start) + converted + input.value.slice(end);
  const newPos = start + converted.length;
  input.setSelectionRange(start, newPos);
}

document.getElementById('barBtn').addEventListener('click', () => addCombiningMark('\u0305'));
document.getElementById('dotBtn').addEventListener('click', () => addCombiningMark('\u02D9'));

const moreToggle = document.getElementById('moreToggle');
const moreToolbar = document.getElementById('moreToolbar');
const dockSpacer = document.getElementById('dockSpacer');
const inputDock = document.querySelector('.input-dock');

function updateDockSpacer(){
  dockSpacer.style.height = inputDock.offsetHeight + 'px';
}
window.addEventListener('load', updateDockSpacer);
window.addEventListener('resize', updateDockSpacer);
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(updateDockSpacer);
}

moreToggle.addEventListener('click', () => {
  const isCollapsed = moreToolbar.classList.toggle('collapsed');
  moreToggle.classList.toggle('open', !isCollapsed);
  moreToggle.querySelector('span').textContent = isCollapsed
    ? '더 보기 (줄긋기 · 순환마디 점)'
    : '접기';
  updateDockSpacer();
});
document.getElementById('clearBtn').addEventListener('click', () => { input.value=''; });

const micBtn = document.getElementById('micBtn');
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

function convertSpokenMath(text){
  let t = text.trim().replace(/[.。]+$/, '');

  const numMap = {'영':'0','공':'0','일':'1','이':'2','삼':'3','사':'4','오':'5','육':'6','칠':'7','팔':'8','구':'9'};
  const supMap2 = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  const subMap2 = {'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉',
    'a':'ₐ','e':'ₑ','h':'ₕ','i':'ᵢ','j':'ⱼ','k':'ₖ','l':'ₗ','m':'ₘ','n':'ₙ','o':'ₒ','p':'ₚ','r':'ᵣ','s':'ₛ','t':'ₜ','u':'ᵤ','v':'ᵥ','x':'ₓ'};
  const letterWordMap = {'에이':'a','비':'b','씨':'c','디':'d','엑스':'x','와이':'y','제트':'z',
    '엔':'n','아이':'i','제이':'j','케이':'k','엘':'l','엠':'m','오':'o','피':'p','알':'r','에스':'s','티':'t','유':'u','브이':'v'};

  function tokenToChar(word){
    if(numMap[word] !== undefined) return numMap[word];
    if(letterWordMap[word]) return letterWordMap[word];
    return word;
  }

  // 1. 괄호: 열기/닫기를 각각 지정
  t = t.replace(/소괄호\s*열기/g, '(');
  t = t.replace(/소괄호\s*닫기/g, ')');
  t = t.replace(/중괄호\s*열기/g, '{');
  t = t.replace(/중괄호\s*닫기/g, '}');
  t = t.replace(/대괄호\s*열기/g, '[');
  t = t.replace(/대괄호\s*닫기/g, ']');

  // 2. 그리스문자 (대문자/소문자 구분이 있는 것 먼저 처리)
  t = t.replace(/소문자\s*시그마/g, 'σ').replace(/시그마/g, 'Σ');
  t = t.replace(/소문자\s*델타/g, 'δ').replace(/델타/g, 'Δ');
  t = t.replace(/대문자\s*오메가/g, 'Ω').replace(/오메가/g, 'ω');
  t = t.replace(/대문자\s*피/g, 'Φ').replace(/(?<![가-힣])피(?![가-힣])/g, 'φ');
  const greekMap = {'알파':'α','베타':'β','감마':'γ','입실론':'ε','세타':'θ','람다':'λ','뮤':'μ','파이':'π','로':'ρ','카이':'χ'};
  for(const [kor, sym] of Object.entries(greekMap)){
    t = t.split(kor).join(sym);
  }

  // 3. 관계·포함·도형 표현: "A는 B보다 ~다" 구문을 A[기호]B 순서로 재배열
  const comparatorMap = new Map([
    ['크거나 같다', '≥'], ['크거나같다', '≥'],
    ['작거나 같다', '≤'], ['작거나같다', '≤'],
    ['같지 않다', '≠'], ['같지않다', '≠'],
    ['거의 같다', '≈'], ['거의같다', '≈'], ['근사하다', '≈'],
    ['이상이다', '≥'], ['이상', '≥'],
    ['이하이다', '≤'], ['이하', '≤'],
    ['초과이다', '>'], ['초과', '>'],
    ['미만이다', '<'], ['미만', '<'],
    ['크다', '>'], ['작다', '<'],
    ['원소가 아니다', '∉'], ['원소가아니다', '∉'],
    ['원소이다', '∈'], ['원소다', '∈'],
    ['진부분집합이다', '⊂'],
    ['부분집합이다', '⊂'],
    ['포함한다', '⊂'], ['포함하다', '⊂'],
    ['포함된다', '⊃'], ['포함되다', '⊃'],
    ['수직', '⊥'], ['평행', '∥'],
    ['합동', '≡'], ['닮음', '∽'],
  ]);
  const comparatorPattern = [...comparatorMap.keys()]
    .sort((a,b) => b.length - a.length)
    .map(k => k.replace(/ /g, '\\s*'))
    .join('|');

  // 3-1. 간단형: "에이 크다 비" → a>b (주어-비교어-값 순서, 조사/보다 불필요)
  const simpleComparatorRe = new RegExp(`(\\S+?)\\s+(${comparatorPattern})\\s+(\\S+?)(?=\\s|$)`, 'g');
  t = t.replace(simpleComparatorRe, (match, subject, word, value) => {
    const key = word.replace(/\s/g, '');
    const symbol = comparatorMap.get(word) || comparatorMap.get(key);
    return symbol ? `${subject}${symbol}${value}` : match;
  });

  // 3-2. 문장형: "에이는 비보다 크다" → a>b (조사·보다·이다 포함 형태)
  const comparatorRe = new RegExp(`(\\S+?)(?:는|은|가|이)\\s*(\\S+?)\\s*(?:보다\\s*)?(${comparatorPattern})(?:이다)?`, 'g');
  t = t.replace(comparatorRe, (match, subject, value, word) => {
    const key = word.replace(/\s/g, '');
    const symbol = comparatorMap.get(word) || comparatorMap.get(key);
    return symbol ? `${subject}${symbol}${value}` : match;
  });

  // 4. 위첨자/아래첨자: "에이 위첨자 엔" → aⁿ, "에이 아래첨자 엔" → aₙ
  t = t.replace(/(\S+?)\s*위첨자\s*(\S+?)(?=\s|$)/g, (m, base, val) => {
    const ch = tokenToChar(val);
    return base + (supMap2[ch] || ch);
  });
  t = t.replace(/(\S+?)\s*아래첨자\s*(\S+?)(?=\s|$)/g, (m, base, val) => {
    const ch = tokenToChar(val);
    return base + (subMap2[ch] || ch);
  });

  // 5. 거듭제곱 표현 (숫자말과 '제곱' 사이에 공백이 있어도 인식되도록 \s* 허용)
  t = t.replace(/(\S)\s*세\s*제곱/g, '$1³');
  t = t.replace(/(\S)\s*네\s*제곱/g, '$1⁴');
  t = t.replace(/(\S)\s*다섯\s*제곱/g, '$1⁵');
  t = t.replace(/(\S)\s*여섯\s*제곱/g, '$1⁶');
  t = t.replace(/(\S)\s*일곱\s*제곱/g, '$1⁷');
  t = t.replace(/(\S)\s*여덟\s*제곱/g, '$1⁸');
  t = t.replace(/(\S)\s*아홉\s*제곱/g, '$1⁹');
  t = t.replace(/(\S)\s*제곱/g, '$1²');

  // 5-1. 엑스바 (평균 표기, x̄) — 변수 매핑보다 먼저 처리
  t = t.replace(/엑스바/g, 'x\u0305');

  // 6. 변수
  const varMap = {'엑스':'x','와이':'y','제트':'z','에이':'a','비':'b','씨':'c'};
  for(const [kor, sym] of Object.entries(varMap)){
    t = t.split(kor).join(sym);
  }

  // 7. 기본 연산자
  t = t.replace(/플\s*러스\s*마이너스|쁠\s*러스\s*마이너스|뜰\s*러스\s*마이너스|을\s*러스\s*마이너스|플\s*마|쁠\s*마|뜰\s*마|뿔\s*마|풀\s*마|을\s*마/g, '±');
  t = t.replace(/더하기|플러스/g, '+');
  t = t.replace(/빼기|마이너스/g, '-');
  t = t.replace(/곱하기/g, '×');
  t = t.replace(/나누기/g, '÷');
  t = t.replace(/세\s*제곱\s*근/g, '∛');
  t = t.replace(/네\s*제곱\s*근/g, '∜');
  t = t.replace(/루트/g, '√');
  t = t.replace(/무한대/g, '∞');
  t = t.replace(/퍼센트/g, '%');
  t = t.replace(/절댓값/g, '|');
  t = t.replace(/내적/g, '·');
  t = t.replace(/(?<=\s|^)대(?=\s|$)/g, ':');

  // 8. 집합·논리 기호
  t = t.replace(/합집합/g, '∪');
  t = t.replace(/교집합/g, '∩');
  t = t.replace(/공집합/g, '∅');
  t = t.replace(/(\S+?)\s*의?\s*여집합/g, '$1ᶜ');
  t = t.replace(/모든/g, '∀');
  t = t.replace(/존재한다/g, '∃');
  t = t.replace(/부정/g, '¬');

  // 9. 화살표
  t = t.replace(/그러면/g, '⇒');
  t = t.replace(/동치/g, '⇔');
  t = t.replace(/왼쪽\s*화살표/g, '←');
  t = t.replace(/양쪽\s*화살표/g, '↔');
  t = t.replace(/화살표/g, '→');
  t = t.replace(/증가/g, '↑');
  t = t.replace(/감소/g, '↓');

  // 10. 미적분
  t = t.replace(/이중적분/g, '∬');
  t = t.replace(/적분/g, '∫');
  t = t.replace(/편미분/g, '∂');
  t = t.replace(/나블라/g, '∇');
  t = t.replace(/극한|리미트/g, 'lim');

  // 11. 도형
  t = t.replace(/삼각형/g, '△');
  t = t.replace(/사각형/g, '□');
  t = t.replace(/(?<![가-힣])각(?![가-힣])/g, '∠');

  // 11-1. 삼각함수 이름 (숫자로 오인되지 않도록 숫자 변환보다 먼저 처리)
  t = t.replace(/코사인/g, 'cos');
  t = t.replace(/사인/g, 'sin');
  t = t.replace(/탄젠트/g, 'tan');

  // 12. 기타
  t = t.replace(/따라서/g, '∴');
  t = t.replace(/왜냐하면/g, '∵');

  // 13. 같다/등호
  t = t.replace(/같다|같음/g, '=');
  t = t.replace(/(는|은)\s*/g, '=');

  // 14. 숫자(한자어 수사, 십·백·천 단위 조합 포함) → 아라비아 숫자
  t = t.replace(/[영공일이삼사오육칠팔구십백천만]+/g, (tok) => {
    const digitMap = {'영':0,'공':0,'일':1,'이':2,'삼':3,'사':4,'오':5,'육':6,'칠':7,'팔':8,'구':9};
    const unitMap = {'십':10,'백':100,'천':1000};
    let result = 0, section = 0, num = 0;
    for(const ch of tok){
      if(digitMap[ch] !== undefined){
        num = digitMap[ch];
      }else if(unitMap[ch]){
        section += (num || 1) * unitMap[ch];
        num = 0;
      }else if(ch === '만'){
        result += (section + num || 1) * 10000;
        section = 0; num = 0;
      }
    }
    result += section + num;
    return String(result);
  });

  // 14-1. 숫자 뒤에 붙는 '도' → 도(degree) 기호
  t = t.replace(/(\d+)\s*도(?![가-힣])/g, '$1°');

  // 14-2. "+"와 "-"가 붙어서 나오면 ±로 합치기 (플러스마이너스가 개별 단어로 쪼개져 인식된 경우 대비)
  t = t.replace(/\+\s*-|-\s*\+/g, '±');

  // 15. 공백 정리
  t = t.replace(/\s*([+\-×÷=≥≤≠≈±√∈∉⊂⊃∪∩∀∃∅¬→←↔⇒⇔↑↓∫∬∂∇∠△□⊥∥≡≅∽∴∵·:%|°])\s*/g, '$1');
  t = t.replace(/\s+/g, ' ').trim();

  return t;
}


if(SpeechRecognitionAPI){
  micBtn.classList.remove('unsupported');
  document.getElementById('guideBtn').classList.remove('unsupported');
  const recognition = new SpeechRecognitionAPI();
  recognition.lang = 'ko-KR';
  recognition.interimResults = false;
  recognition.continuous = false;
  let listening = false;

  micBtn.addEventListener('click', () => {
    if(listening){
      recognition.stop();
      return;
    }
    try{
      recognition.start();
    }catch(e){}
  });

  recognition.addEventListener('start', () => {
    listening = true;
    micBtn.classList.add('listening');
  });

  recognition.addEventListener('end', () => {
    listening = false;
    micBtn.classList.remove('listening');
  });

  recognition.addEventListener('error', () => {
    listening = false;
    micBtn.classList.remove('listening');
  });

  recognition.addEventListener('result', (event) => {
    const rawTranscript = event.results[0][0].transcript;
    const transcript = convertSpokenMath(rawTranscript);
    const needsSpace = input.value.length > 0 && !/\s$/.test(input.value);
    insertAtCursor((needsSpace ? ' ' : '') + transcript);
  });
}

const copyBtn = document.getElementById('copyBtn');
copyBtn.addEventListener('click', async () => {
  const text = input.value;
  if(!text){ input.focus(); return; }
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    input.select();
    document.execCommand('copy');
  }
  copyBtn.textContent = '복사 완료!';
  copyBtn.classList.add('copied');
  setTimeout(()=>{
    copyBtn.textContent = '복사하기';
    copyBtn.classList.remove('copied');
  },1800);
});
